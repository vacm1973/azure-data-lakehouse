
name: Lakehouse Pipeline Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PySpark
        run: pip install pyspark==3.5.3

      - name: Run Bronze ingestion
        run: python bronze_ingestion.py

      - name: Run Silver transformation
        run: python silver_transformation.py

      - name: Run Gold analytics
        run: python gold_analytics.py

      - name: Verify Gold output
        run: |
          python - <<'PY'
          from pyspark.sql import SparkSession

          spark = SparkSession.builder.appName("VerifyGold").getOrCreate()
          df = spark.read.parquet("data/gold/customer_analytics")

          results = {
              row["customer_id"]: row
              for row in df.collect()
          }

          assert len(results) == 3
          assert results[1]["total_transactions"] == 2
          assert abs(results[1]["total_amount"] - 2250.0) < 0.01

          print("Gold output validation passed")
          spark.stop()
          PY
